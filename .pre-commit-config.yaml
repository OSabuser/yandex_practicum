# Pre-commit hooks configuration
# See https://pre-commit.com for more information

repos:
  # Ruff - линтер и форматтер (заменяет flake8, isort, black и другие)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      # Запуск линтера (проверка кода)
      - id: ruff
        args: [--fix]  # Автоматически исправляет что может
        name: "Ruff: проверка и исправление кода"

      # Запуск форматтера
      - id: ruff-format
        name: "Ruff: форматирование кода"

  # Pytest - запуск тестов
  - repo: local
    hooks:
      - id: pytest-check
        name: "Pytest: запуск тестов"
        entry: bash -c 'uv run python -m pytest'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  # Стандартные хуки для базовых проверок
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Проверка синтаксиса YAML файлов
      - id: check-yaml
        name: "Проверка YAML файлов"

      # Проверка синтаксиса TOML файлов
      - id: check-toml
        name: "Проверка TOML файлов"


      # Проверка что файлы заканчиваются переводом строки
      - id: end-of-file-fixer
        name: "Добавление переноса строки в конец файла"

      # Проверка на большие файлы (>500KB)
      - id: check-added-large-files
        args: ['--maxkb=500']
        name: "Проверка на большие файлы"

      # Проверка merge конфликтов
      - id: check-merge-conflict
        name: "Проверка на merge конфликты"

      # Предотвращение коммита в main/master (закомментировано для учебного проекта)
      # - id: no-commit-to-branch
      #   args: ['--branch', 'main', '--branch', 'master']
      #   name: "Запрет коммита напрямую в main/master"

# Общие настройки
default_language_version:
  python: python3.13

# Исключения - файлы/папки которые не проверяем
exclude: |
  (?x)^(
    \.git/|
    \docs/|
    \.pytest_cache/|
    __pycache__/|
    \.venv/|
    \.uv/
  )
